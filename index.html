<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Your Eyes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">

<title>I’m Your Eyes</title>
</head>
<body>
<header>I’m Your Eyes · ຕາຂອງເຈົ້າ</header>
<main id="stage">

  <div id="banner" role="status" aria-live="assertive">ກົດປຸ່ມເພື່ອເລີ່ມ · Tap to start</div>

    <div class="ok">✅</div>
    <div id="amt"></div>
    <div id="amtEn"></div>
  </section>
</main>
<div class="actions" id="actions"></div>
<p class="note" id="note"></p>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
