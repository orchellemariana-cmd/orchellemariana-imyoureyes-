<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Your Eyes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<title>I’m Your Eyes</title>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="ov"></canvas>
  <div id="status">I’m Your Eyes</div>
  <button id="demo" hidden>Demo</button>
  <button id="light" hidden aria-label="ເປີດ/ປິດໄຟ. Light on or off">🔦 OFF</button>
  <button id="tap" hidden aria-label="ແຕະເພື່ອຟັງອີກຄັ້ງ. Tap to hear again"></button>
  <div id="panel" hidden>
    <div id="count"></div>
    <div id="total"></div>
    <div id="totalEn"></div>
  </div>
  <button id="start">
    <span class="eye">👁️</span>
    <span>ແຕະເພື່ອເລີ່ມ</span>
    <span class="sub">Tap to start</span>
  </button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="/lao.js"></script>
<script src="/detect.js"></script>
<script src="/app.js"></script>
</body>
</html>
